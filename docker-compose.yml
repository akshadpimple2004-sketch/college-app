version: '3.8'

services:
  # 1. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: college-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: college_secure_pass
      MYSQL_DATABASE: college_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcollege_secure_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - college-network

  # 2. Node.js Express API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college-backend
    restart: always
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: college_secure_pass
      DB_NAME: college_db
      DB_PORT: 3306
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - college-network

  # 3. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - college-network

  # 4. Nginx Reverse Proxy Service (API Gateway)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: college-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - college-network

  # 5. Prometheus Monitoring Service
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: college-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - college-network

  # 6. Grafana Visualizer Service
  grafana:
    image: grafana/grafana:10.0.0
    container_name: college-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - college-network

networks:
  college-network:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
