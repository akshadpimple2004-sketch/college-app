version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: college-db-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: college_prod_secure_pass
      MYSQL_DATABASE: college_db
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcollege_prod_secure_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - college-prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college-backend-prod
    restart: always
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: college_prod_secure_pass
      DB_NAME: college_db
      DB_PORT: 3306
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - college-prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college-frontend-prod
    restart: always
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - college-prod-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: college-nginx-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - college-prod-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: college-prometheus-prod
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_prod_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - college-prod-network

  grafana:
    image: grafana/grafana:10.0.0
    container_name: college-grafana-prod
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_prod_pass_123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_prod_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - college-prod-network

networks:
  college-prod-network:
    driver: bridge

volumes:
  mysql_prod_data:
  prometheus_prod_data:
  grafana_prod_data:
