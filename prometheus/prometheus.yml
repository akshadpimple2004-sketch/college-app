global:
  scrape_interval: 5s # Scrape targets every 5 seconds (useful for demo/testing)
  evaluation_interval: 5s # Evaluate alert rules every 5 seconds

scrape_configs:
  # 1. Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Scrape our Express Node.js application
  - job_name: 'college-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']
