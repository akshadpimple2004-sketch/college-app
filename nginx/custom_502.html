<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Temporarily Unavailable | Academix</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 2.5rem;
            background-color: #131a26;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #ef4444;
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 1rem;
        }
        p {
            color: #9ca3af;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .badge {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ Service Unavailable</h1>
        <p>Academix backend services are currently undergoing maintenance or starting up. Please refresh the page in a few moments.</p>
        <span class="badge">HTTP 502 - Bad Gateway</span>
    </div>
</body>
</html>
